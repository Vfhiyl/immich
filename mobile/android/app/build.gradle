// where native/build-region.sh builds (see below)
def nativeWork = System.getenv('IMMICH_NATIVE_WORK') ?:
  "${System.getenv('HOME') ?: System.getProperty('user.home')}/.cache/immich-native"
def regionRoot = "${nativeWork}/region"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  compileSdk = flutter.compileSdkVersion
  ndkVersion = flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
    test.java.srcDirs += 'src/test/kotlin'
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  defaultConfig {
    applicationId "app.alextran.immich"
    minSdk = 26
    targetSdk = flutter.targetSdkVersion
    versionCode flutter.versionCode
    versionName flutter.versionName
    resValue "string", "app_name", "Immich"

    externalNativeBuild {
      cmake {
        arguments "-DIMMICH_REGION_ROOT=${regionRoot}", "-DANDROID_STL=c++_static"
      }
    }
  }

  signingConfigs {
    release {
      def keyAliasVal = System.getenv("ALIAS")
      def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")
      def storePasswordVal = System.getenv("ANDROID_STORE_PASSWORD")

      keyAlias keyAliasVal ?: keystoreProperties['keyAlias']
      keyPassword keyPasswordVal ?: keystoreProperties['keyPassword']
      storeFile file("../key.jks").exists() ? file("../key.jks") : file(keystoreProperties['storeFile'] ?: '../key.jks')
      storePassword storePasswordVal ?: keystoreProperties['storePassword']
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-DEBUG'
    }

    release {
      def hasKeystore = file("../key.jks").exists() && file("../key.jks").length() > 0
      signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

      def prNumber = System.getenv("PR_NUMBER")
      if (prNumber) {
        applicationIdSuffix ".pr${prNumber}"
        versionNameSuffix "-pr${prNumber}"
        resValue "string", "app_name", "Immich PR ${prNumber}"
      }
    }
  }
  namespace 'app.alextran.immich'

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}

// The static libraries of our decoders for parts of large images (CMakeLists.txt), built from native/sources.txt with
// our patches by native/build-region.sh, into IMMICH_NATIVE_WORK (by default ~/.cache/immich-native); it builds a
// library again only when its source, patches or compiler changed
def regionAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
def regionTasks = regionAbis.collect { abi ->
  tasks.register("buildRegionLibraries-${abi}", Exec) {
    commandLine rootProject.file('../../native/build-region.sh'), "android-${abi}", "${regionRoot}/android-${abi}"
    environment 'IMMICH_NATIVE_WORK', nativeWork
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    // its output only if it fails
    def output = new ByteArrayOutputStream()
    standardOutput = output
    errorOutput = output
    ignoreExitValue = true
    doLast {
      if (executionResult.get().exitValue != 0) {
        throw new GradleException("native/build-region.sh android-${abi} failed:\n${output}")
      }
    }
  }
}
tasks.configureEach { task ->
  if (task.name.startsWith('configureCMake')) {
    task.dependsOn(regionTasks)
  }
}

