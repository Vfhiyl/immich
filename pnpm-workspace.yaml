packages:
  - packages/**
  - docs
  - e2e
  - i18n
  - server
  - plugins
  - web
  - .github
  - packages/*
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: true
  canvas: false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  utimes: false
  '@tailwindcss/oxide': true
  core-js-pure: false
  postman-code-generators: false
  unrs-resolver: false
overrides:
  canvas: 3.2.3
  sharp: 0.35.5
  # sharp's module is built with Immich's own libvips (native/); the prebuilt modules, with libvips of their own, are not
  # installed
  '@img/sharp-darwin-arm64': '-'
  '@img/sharp-darwin-x64': '-'
  '@img/sharp-freebsd-wasm32': '-'
  '@img/sharp-linux-arm': '-'
  '@img/sharp-linux-arm64': '-'
  '@img/sharp-linux-ppc64': '-'
  '@img/sharp-linux-riscv64': '-'
  '@img/sharp-linux-s390x': '-'
  '@img/sharp-linux-x64': '-'
  '@img/sharp-linuxmusl-arm64': '-'
  '@img/sharp-linuxmusl-x64': '-'
  '@img/sharp-webcontainers-wasm32': '-'
  '@img/sharp-wasm32': '-'
  '@img/sharp-win32-arm64': '-'
  '@img/sharp-win32-ia32': '-'
  '@img/sharp-win32-x64': '-'
  '@img/sharp-libvips-darwin-arm64': '-'
  '@img/sharp-libvips-darwin-x64': '-'
  '@img/sharp-libvips-linux-arm': '-'
  '@img/sharp-libvips-linux-arm64': '-'
  '@img/sharp-libvips-linux-ppc64': '-'
  '@img/sharp-libvips-linux-riscv64': '-'
  '@img/sharp-libvips-linux-s390x': '-'
  '@img/sharp-libvips-linux-x64': '-'
  '@img/sharp-libvips-linuxmusl-arm64': '-'
  '@img/sharp-libvips-linuxmusl-x64': '-'
  # 1.9.3-1.9.5 are confirmed broken
  tsc-alias: 1.9.2
packageExtensions:
  nestjs-kysely:
    dependencies:
      tslib: '*'
  nestjs-otel:
    dependencies:
      tslib: '*'
  '@photo-sphere-viewer/equirectangular-video-adapter':
    dependencies:
      three: '*'
  '@photo-sphere-viewer/video-plugin':
    dependencies:
      three: '*'
  sharp:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@immich/ui':
    dependencies:
      tailwindcss: '>=4.1'
  tailwind-variants:
    dependencies:
      tailwindcss: '>=4.1'
  bcrypt:
    dependencies:
      node-addon-api: '*'
      node-gyp: '*'
  '@nestjs/swagger':
    peerDependencies:
      typescript: '*'
patchedDependencies:
  # see native/README.md
  sharp@0.35.5: native/patches/sharp/0001-load-only-the-module-built-with-immichs-libvips.patch
dedupePeerDependents: false
preferWorkspacePackages: true
injectWorkspacePackages: true
shamefullyHoist: false
verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - '@immich/ui'
  - '@immich/sql-tools@0.6.3 || 0.6.6'
  - '@nestjs/cli@12.0.1'
