name: Native libraries
# Builds the native libraries of the server (native/build.sh) for a release: on Rocky Linux 8, whose glibc (2.28) is
# the oldest that Node.js 24 runs on, so that they run on every Linux that runs the server. The archive and its SHA-256
# are an artifact of the run; publish them as a release (native/README.md, Releasing).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Name of the release, e.g. 8.18.7-1 (the version of libvips, and a number of our own)'
        required: true

permissions: {}

jobs:
  build:
    name: Build for Linux x64
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:8
    permissions:
      contents: read
    env:
      NODE_VERSION: 24.22.1
      NODE_SHA256: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
      RUST_VERSION: 1.92.0
      RUST_SHA256: d2ccef59dd9f7439f2c694948069f789a044dc1addcc0803613232af8f88ee0c
      CARGO_C_VERSION: 0.10.21
      MESON_VERSION: 1.11.1
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Install the tools
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf install -y --setopt=tsflags=nodocs gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ gcc-toolset-14-binutils \
            make cmake nasm autoconf automake libtool gperf gettext-devel pkgconf-pkg-config python3.12 python3.12-pip \
            xz bzip2 patch git jq tar openssl-devel perl findutils diffutils
          python3.12 -m pip install --quiet "meson==$MESON_VERSION" ninja
          curl --fail --silent --show-error --location -o /tmp/node.tar.xz \
            "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$NODE_SHA256  /tmp/node.tar.xz" | sha256sum --check
          mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          curl --fail --silent --show-error --location -o /tmp/rust.tar.xz \
            "https://static.rust-lang.org/dist/rust-$RUST_VERSION-x86_64-unknown-linux-gnu.tar.xz"
          echo "$RUST_SHA256  /tmp/rust.tar.xz" | sha256sum --check
          mkdir -p /tmp/rust && tar -xJf /tmp/rust.tar.xz -C /tmp/rust --strip-components=1
          /tmp/rust/install.sh --prefix=/opt/rust --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
          CARGO_HOME=/opt/cargo /opt/rust/bin/cargo install cargo-c --version "$CARGO_C_VERSION" --locked --root /opt/rust

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          export PATH="/opt/rh/gcc-toolset-14/root/usr/bin:/opt/node/bin:/opt/rust/bin:$PATH"
          IMMICH_NATIVE_WORK=/tmp/native IMMICH_NATIVE_RELEASE="$RELEASE" native/build.sh "$PWD/native-output"
          sha256sum "native-output/immich-native-$RELEASE-linux-x64.tar.gz" | tee "native-output/immich-native-$RELEASE-linux-x64.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immich-native-${{ inputs.release }}-linux-x64
          path: |
            native-output/immich-native-${{ inputs.release }}-linux-x64.tar.gz
            native-output/immich-native-${{ inputs.release }}-linux-x64.tar.gz.sha256
